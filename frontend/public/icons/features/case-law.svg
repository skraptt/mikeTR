<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C08A57"/>
      <stop offset="0.5" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#5C3A1A"/>
    </linearGradient>
    <linearGradient id="brassBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7791F"/>
      <stop offset="0.5" stop-color="#F6CB63"/>
      <stop offset="1" stop-color="#B7791F"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9743F"/>
      <stop offset="1" stop-color="#5C3A1A"/>
    </linearGradient>
  </defs>
  <!-- sounding block -->
  <rect x="8" y="49" width="30" height="7" rx="2.5" fill="url(#block)"/>
  <rect x="11" y="47" width="24" height="3" rx="1.5" fill="#C08A57"/>
  <!-- handle -->
  <rect x="29" y="25" width="6" height="30" rx="3" transform="rotate(-45 32 40)" fill="url(#wood)"/>
  <!-- head -->
  <g transform="rotate(-45 30 22)">
    <rect x="14" y="14" width="32" height="16" rx="5" fill="url(#wood)"/>
    <rect x="18" y="14" width="4" height="16" fill="url(#brassBand)"/>
    <rect x="38" y="14" width="4" height="16" fill="url(#brassBand)"/>
    <rect x="15" y="16" width="30" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
</svg>
