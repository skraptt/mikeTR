<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#E0A63A"/>
      <stop offset="1" stop-color="#A86B12"/>
    </linearGradient>
    <linearGradient id="brassBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7791F"/>
      <stop offset="0.5" stop-color="#F6CB63"/>
      <stop offset="1" stop-color="#B7791F"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/>
      <stop offset="0.45" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#9A5F0E"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1F2937" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="sheen">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <path d="M19 57 Q32 50 45 57 Z" fill="url(#brass)" stroke="url(#rim)" stroke-width="1.2"/>
  <rect x="17" y="56" width="30" height="4" rx="2" fill="url(#brass)" stroke="url(#rim)" stroke-width="1"/>

  <!-- pillar -->
  <rect x="30" y="12" width="4" height="42" rx="2" fill="url(#brassBar)"/>
  <circle cx="32" cy="10" r="4" fill="url(#brass)" stroke="url(#rim)" stroke-width="1.1"/>
  <ellipse cx="31" cy="8.6" rx="1.8" ry="1" fill="url(#sheen)" opacity="0.8"/>

  <!-- beam -->
  <rect x="8" y="15" width="48" height="3.6" rx="1.8" fill="url(#brassBar)" stroke="url(#rim)" stroke-width="0.8"/>

  <!-- chains -->
  <g stroke="#B7791F" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M11 18 L5 36"/>
    <path d="M11 18 L17 36"/>
    <path d="M53 18 L47 36"/>
    <path d="M53 18 L59 36"/>
  </g>

  <!-- pans -->
  <g>
    <path d="M3 36 H19 Q19 45 11 45 Q3 45 3 36 Z" fill="url(#pan)" stroke="url(#rim)" stroke-width="1.2"/>
    <ellipse cx="9" cy="38.4" rx="3.6" ry="1.3" fill="url(#sheen)" opacity="0.7"/>
  </g>
  <g>
    <path d="M45 36 H61 Q61 45 53 45 Q45 45 45 36 Z" fill="url(#pan)" stroke="url(#rim)" stroke-width="1.2"/>
    <ellipse cx="51" cy="38.4" rx="3.6" ry="1.3" fill="url(#sheen)" opacity="0.7"/>
  </g>
</svg>
